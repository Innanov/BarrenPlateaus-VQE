# Shared tool configuration for the pre-commit linters (ruff, black, isort).
[tool.black]
line-length = 82
target-version = ["py310"]

[tool.isort]
profile = "black"  # keep isort and black from fighting over imports
line_length = 82

[tool.ruff]
line-length = 82
target-version = "py310"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade.
# E501 (line too long) also covers comments and docstrings, which black skips.
select = ["E", "W", "F", "B", "UP"]
